[package]
name = "tordo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
difflib = "0.4.0"
minreq = { version = "3.0.0", features = ["https"] }
pulldown-cmark = "0.13.4"
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tera = { version = "2.4.0", features = ["glob_fs"] }
toml = "1.1.8"
unicode-normalization = "0.1.26"
