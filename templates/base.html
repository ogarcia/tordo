<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Description + Open Graph / link previews -->
  <meta name="description" content="{{ meta.description }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ meta.title }}">
  <meta property="og:description" content="{{ meta.description }}">
  {% if meta.image %}<meta property="og:image" content="{{ meta.image }}">{% endif %}
  {% if meta.url %}<meta property="og:url" content="{{ meta.url }}">{% endif %}
  <meta name="twitter:card" content="summary_large_image">

  <title>{{ meta.doc_title }}</title>
  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="index.html">{{ site.title }}</a>
  </header>
  <main>
    {% block content %}{% endblock content %}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      {% if site.telegram %}<p class="contribute">{{ t.contribute }} <a href="{{ site.telegram }}" target="_blank" rel="noopener">Telegram</a>.</p>{% else %}<span></span>{% endif %}
      <p>{{ t.tmdb_attribution }}</p>
    </div>
  </footer>
  <script src="static/app.js"></script>
</body>
</html>
